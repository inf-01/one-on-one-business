<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Micro Tareas">
<meta name="theme-color" content="#181B21">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Calendario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <!-- Header: navegación semanal + título con rango + tema -->
  <header class="neu">
    <div class="nav-group">
      <button class="neu-btn nav-btn" id="prevBtn" aria-label="Semana anterior">‹</button>
      <button class="neu-btn today-btn" id="todayBtn">Hoy</button>
    </div>
    <div class="month-title" id="monthTitle"><span class="marquee-track" id="marqueeTrack"></span></div>
    <div class="nav-group">
      <button class="neu-btn tool-btn" id="themeBtn" aria-label="Cambiar tema" title="Cambiar tema"><span class="pxicon" id="themeIcon"></span></button>
      <button class="neu-btn nav-btn" id="nextBtn" aria-label="Semana siguiente">›</button>
    </div>
  </header>

  <!-- Barra de herramientas: iconos + PROGRESO GENERAL (José + Luis) -->
  <div class="neu toolbar">
    <button class="neu-btn tool-btn" id="alarmBtn" aria-label="Activar alarmas" title="Activar alarmas de tareas"><span class="pxicon" id="alarmIcon"></span></button>
    <button class="neu-btn tool-btn" id="minutaBtn" aria-label="Minuta rápida" title="Pegar minuta y crear tareas"><span class="pxicon" id="minutaIcon"></span></button>
    <button class="neu-btn tool-btn" id="exportBtn" aria-label="Exportar datos" title="Exportar respaldo"><span class="pxicon" id="exportIcon"></span></button>
    <label class="neu-btn tool-btn" aria-label="Importar datos" title="Importar respaldo"><span class="pxicon" id="importIcon"></span><input type="file" id="importInput" accept="application/json"></label>
    <button class="neu-btn tool-btn" id="dashBtn" aria-label="Dashboard" title="Ver dashboard de métricas"><span class="pxicon" id="dashIcon"></span></button>
    <div class="toolbar-progress">
      <span class="progress-label">General</span>
      <div class="progress-track"><div class="progress-fill" id="generalFill"></div></div>
      <span class="progress-count" id="generalCount">0/0</span>
    </div>
  </div>

  <!-- Calendario: SOLO los 7 días de la semana (Dom a Sáb) -->
  <div class="neu calendar">
    <div class="weekdays">
      <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Panel inferior: selector de usuario + PROGRESO PERSONAL + eventos -->
  <div class="neu panel">
    <div class="panel-head">
      <h2 id="selTitle">Eventos</h2>
      <button class="neu-btn add-btn" id="addBtn" aria-label="Agregar evento">+</button>
    </div>

    <div class="personal-block">
      <div class="user-toggle" id="userToggle" role="group" aria-label="Seleccionar usuario">
        <button type="button" class="neu-btn user-chip active" data-user="José">JOSÉ</button>
        <button type="button" class="neu-btn user-chip" data-user="Luis">LUIS</button>
      </div>
      <div class="neu-inset personal-progress">
        <span class="progress-label" id="personalLabel">Progreso José</span>
        <div class="progress-track"><div class="progress-fill jose" id="personalFill"></div></div>
        <span class="progress-count" id="personalCount">0/0</span>
      </div>
    </div>

    <div class="event-list" id="eventList"></div>
  </div>

  <div class="brand">
    <div class="brand-title"><span class="bt-name"><span class="bt-dia">One on One</span> <span class="bt-cero">Business</span></span><span class="bt-sep">|</span><span class="bt-sub">Micro-tareas y Foco</span></div>
    <button class="brand-btn" type="button" id="brandBtn" aria-label="One on One Business">
      <img class="logo-dark" src="logo-dark.png" alt="One on One Business">
      <img class="logo-light" src="logo-light.png" alt="One on One Business">
    </button>
  </div>
</div>

<!-- Modal: nuevo evento -->
<div class="modal-overlay" id="overlay">
  <div class="neu modal">
    <h3>Nuevo evento</h3>
    <div class="field">
      <label for="evTitle">Título</label>
      <input id="evTitle" type="text" placeholder="Ej. Reunión de equipo" maxlength="60">
    </div>
    <div class="field">
      <label for="evTime">Hora (opcional)</label>
      <input id="evTime" type="time">
    </div>
    <div class="field">
      <label>Responsable</label>
      <div class="user-toggle" id="evUserToggle">
        <button type="button" class="neu-btn user-chip active" data-user="José">JOSÉ</button>
        <button type="button" class="neu-btn user-chip" data-user="Luis">LUIS</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="neu-btn" id="cancelBtn">Cancelar</button>
      <button class="neu-btn save-btn" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: MINUTA (pegar texto → API) -->
<div class="modal-overlay" id="minutaOverlay">
  <div class="neu modal">
    <h3>Minuta del día</h3>
    <div class="field">
      <label for="minutaText">Pega el texto (una tarea por línea)</label>
      <textarea id="minutaText" placeholder="Llamar al cliente&#10;Enviar el informe&#10;Revisar presupuesto"></textarea>
    </div>
    <div class="field">
      <label>Responsable</label>
      <div class="user-toggle" id="minutaUserToggle">
        <button type="button" class="neu-btn user-chip active" data-user="José">JOSÉ</button>
        <button type="button" class="neu-btn user-chip" data-user="Luis">LUIS</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="neu-btn" id="minutaCancelBtn">Cancelar</button>
      <button class="neu-btn save-btn" id="minutaProcessBtn">Procesar</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
