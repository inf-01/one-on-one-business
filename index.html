<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="One on One Business">
<meta name="theme-color" content="#1e2635">
<!-- Redes sociales (Open Graph / Twitter) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="One on One Business">
<meta property="og:title" content="One on One Business — Calendario semanal">
<meta property="og:description" content="Calendario semanal de micro-tareas del equipo: progreso, minuta con IA y foco.">
<meta property="og:url" content="https://inf-01.github.io/one-on-one-business/">
<meta property="og:image" content="https://inf-01.github.io/one-on-one-business/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="One on One Business — logotipo platino">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="One on One Business — Calendario semanal">
<meta name="twitter:description" content="Calendario semanal de micro-tareas del equipo: progreso, minuta con IA y foco.">
<meta name="twitter:image" content="https://inf-01.github.io/one-on-one-business/og-image.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>One on One Business — Calendario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <!-- Header: navegación semanal + título con rango + tema -->
  <header class="neu">
    <div class="nav-group">
      <button class="neu-btn nav-btn" id="prevBtn" aria-label="Semana anterior">‹</button>
      <button class="neu-btn today-btn" id="todayBtn">Hoy</button>
    </div>
    <div class="month-title" id="monthTitle"><span class="marquee-track" id="marqueeTrack"></span></div>
    <div class="nav-group">
      <button class="neu-btn tool-btn" id="themeBtn" aria-label="Cambiar tema" title="Cambiar tema"><span class="pxicon" id="themeIcon"></span></button>
      <button class="neu-btn today-btn" id="logoutBtn" title="Cerrar sesión">Salir</button>
      <button class="neu-btn nav-btn" id="nextBtn" aria-label="Semana siguiente">›</button>
    </div>
  </header>

  <!-- Barra de herramientas: iconos + PROGRESO GENERAL (equipo) + proyecto -->
  <div class="neu toolbar">
    <select id="projectFilter" class="dr-select" aria-label="Filtrar por proyecto" style="max-width:190px;flex:0 1 190px;">
      <option value="">Todos los proyectos</option>
    </select>
    <button class="neu-btn tool-btn" id="alarmBtn" aria-label="Activar alarmas" title="Activar alarmas de tareas"><span class="pxicon" id="alarmIcon"></span></button>
    <button class="neu-btn tool-btn" id="minutaBtn" aria-label="Minuta rápida" title="Pegar minuta y que la IA cree las tareas"><span class="pxicon" id="minutaIcon"></span></button>
    <button class="neu-btn tool-btn" id="exportBtn" aria-label="Exportar datos" title="Exportar respaldo"><span class="pxicon" id="exportIcon"></span></button>
    <label class="neu-btn tool-btn" aria-label="Importar datos" title="Importar respaldo"><span class="pxicon" id="importIcon"></span><input type="file" id="importInput" accept="application/json"></label>
    <button class="neu-btn tool-btn" id="dashBtn" aria-label="Dashboard" title="Ver dashboard de métricas"><span class="pxicon" id="dashIcon"></span></button>
    <button class="neu-btn tool-btn" id="dataRoomBtn" aria-label="Data Room" title="Documentos y minutas por proyecto"><span class="pxicon" id="dataRoomIcon"></span></button>
    <div class="toolbar-progress">
      <span class="progress-label">General</span>
      <div class="progress-track"><div class="progress-fill" id="generalFill"></div></div>
      <span class="progress-count" id="generalCount">0/0</span>
    </div>
  </div>

  <!-- Calendario: SOLO los 7 días de la semana (Dom a Sáb) -->
  <div class="neu calendar">
    <div class="weekdays">
      <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Panel inferior: selector de usuario + PROGRESO PERSONAL + eventos -->
  <div class="neu panel">
    <div class="panel-head">
      <h2 id="selTitle">Eventos</h2>
      <button class="neu-btn add-btn" id="addBtn" aria-label="Agregar evento">+</button>
    </div>

    <div class="personal-block">
      <div class="user-toggle" id="userToggle" role="group" aria-label="Seleccionar usuario">
      </div>
      <div class="neu-inset personal-progress">
        <span class="progress-label" id="personalLabel">Progreso</span>
        <div class="progress-track"><div class="progress-fill" id="personalFill"></div></div>
        <span class="progress-count" id="personalCount">0/0</span>
      </div>
    </div>

    <div class="event-list" id="eventList"></div>
  </div>

  <div class="brand">
    <div class="brand-title"><span class="bt-name"><span class="bt-dia">One on One</span> <span class="bt-cero">Business</span></span><span class="bt-sep">|</span><span class="bt-sub">Micro-tareas y Foco</span></div>
    <button class="brand-btn" type="button" id="brandBtn" aria-label="One on One Business">
      <img class="logo-dark" src="logo-dark.png" alt="One on One Business">
      <img class="logo-light" src="logo-light.png" alt="One on One Business">
    </button>
  </div>

  <!-- Modal: sesión (login / registro con rol obligatorio) -->
  <div class="modal-overlay" id="authOverlay">
    <div class="neu modal">
      <h3 id="authTitle">Crear cuenta</h3>
      <div class="user-toggle" id="authTabs" role="group" aria-label="Seleccionar modo">
        <button type="button" class="neu-btn user-chip" data-mode="login">Iniciar sesión</button>
        <button type="button" class="neu-btn user-chip active" data-mode="register">Crear cuenta</button>
      </div>
      <div class="field">
        <label for="authName" id="authNameLabel">Nombre completo *</label>
        <input id="authName" type="text" placeholder="Tu nombre" maxlength="60" autocomplete="name">
      </div>
      <div class="field">
        <label for="authEmail">Correo *</label>
        <input id="authEmail" type="email" placeholder="tu@correo.com" autocomplete="email">
      </div>
      <div class="field" id="authCargoWrap">
        <label for="authCargo">Rol obligatorio * (la IA asigna tareas por rol)</label>
        <select id="authCargo" required>
          <option value="" disabled selected>Selecciona: Técnico Informático / Técnico Contable</option>
          <option value="Tecnologico">Técnico Informático</option>
          <option value="Contable">Técnico Contable</option>
        </select>
        <p class="auth-hint">Sin rol no podemos asignar tareas con la IA. Elige uno de los dos.</p>
      </div>
      <div class="field">
        <label for="authPassword">Contraseña * (mín. 8 caracteres)</label>
        <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <p class="result-note" id="authNote" hidden></p>
      <div class="modal-actions">
        <button class="neu-btn" id="authToggleBtn">Ya tengo cuenta</button>
        <button class="neu-btn save-btn" id="authSubmitBtn">Registrarme</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: nuevo evento -->
<div class="modal-overlay" id="overlay">
  <div class="neu modal">
    <h3>Nuevo evento</h3>
    <div class="field">
      <label for="evTitle">Título</label>
      <input id="evTitle" type="text" placeholder="Ej. Reunión de equipo" maxlength="60">
    </div>
    <div class="field">
      <label for="evTime">Hora (opcional)</label>
      <input id="evTime" type="time">
    </div>
    <div class="field">
      <label>Responsable</label>
      <div class="user-toggle" id="evUserToggle">
      </div>
    </div>
    <div class="modal-actions">
      <button class="neu-btn" id="cancelBtn">Cancelar</button>
      <button class="neu-btn save-btn" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: MINUTA (pegar texto → el servidor extrae, reparte y guarda) -->
<div class="modal-overlay" id="minutaOverlay">
  <div class="neu modal">
    <h3>Minuta del día</h3>

    <!-- Formulario: pegar texto y procesar -->
    <div id="minutaForm">
      <div class="field">
        <label for="minutaText">Pega el texto de la minuta (la IA lo convierte en tareas)</label>
        <textarea id="minutaText" placeholder="Reunión del lunes: Ana envía la propuesta al cliente el jueves a las 10.&#10;El contable revisa el presupuesto mañana.&#10;Recordar llamar al proveedor."></textarea>
      </div>
      <div class="field">
        <label>Responsable por defecto</label>
        <div class="user-toggle" id="minutaUserToggle">
        </div>
      </div>
      <div class="modal-actions">
        <button class="neu-btn" id="minutaCancelBtn">Cancelar</button>
        <button class="neu-btn save-btn" id="minutaProcessBtn">Procesar</button>
      </div>
    </div>

    <!-- Resultado: acuerdos extraídos + tareas creadas en el servidor -->
    <div class="minuta-result" id="minutaResult" hidden>
      <div class="minuta-result-head">
        <span class="badge completada">Procesada</span>
        <h4 id="minutaResultTitle">Minuta procesada</h4>
      </div>
      <div class="result-block" id="minutaAcuerdosWrap" hidden>
        <span class="result-label">Acuerdos</span>
        <ul class="result-list acuerdos" id="minutaAcuerdos"></ul>
      </div>
      <div class="result-block">
        <span class="result-label">Tareas creadas</span>
        <ul class="result-list" id="minutaResultTasks"></ul>
      </div>
      <p class="result-note" id="minutaResultNote" hidden></p>
      <div class="modal-actions">
        <button class="neu-btn save-btn" id="minutaDoneBtn">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/app.ts"></script>
</body>
</html>
